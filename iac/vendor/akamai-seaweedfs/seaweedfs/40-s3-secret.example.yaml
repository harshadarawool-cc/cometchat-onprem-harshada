# SeaweedFS S3 identities — LEAST PRIVILEGE.
# Copy to 40-s3-secret.yaml, fill in real keys, do NOT commit the filled file.
# Generate each key:  openssl rand -hex 16  (access)  /  openssl rand -hex 32  (secret)
#
#  • console  = Admin  → used ONLY by the cometchatFS console (bucket create/delete/lifecycle/
#               versioning/ACL need Admin). Goes into the console's own secret; never shared with apps.
#  • apps     = Read/Write/List/Tagging (NO Admin) → the SHARED key your applications (chat-api,
#               extensions, …) load into their env. Can read/write/list/tag objects in any bucket,
#               but CANNOT create/delete buckets or wipe config. Buckets are pre-created (seed Job
#               or the console) before apps use them.
#
# Public buckets: on SeaweedFS 4.37 public/private is a native per-bucket S3 ACL — set it from the
# console toggle (or the seed Job's PutBucketAcl). No `anonymous` identity needed here anymore.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: __NAMESPACE__
type: Opaque
stringData:
  s3config.json: |
    {
      "identities": [
        {
          "name": "console",
          "credentials": [
            { "accessKey": "__CONSOLE_ACCESS_KEY__", "secretKey": "__CONSOLE_SECRET_KEY__" }
          ],
          "actions": ["Admin"]
        },
        {
          "name": "apps",
          "credentials": [
            { "accessKey": "__APP_ACCESS_KEY__", "secretKey": "__APP_SECRET_KEY__" }
          ],
          "actions": ["Read", "Write", "List", "Tagging"]
        }
      ]
    }
