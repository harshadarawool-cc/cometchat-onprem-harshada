apiVersion: v1
kind: Service
metadata:
  name: cometchatfs
  labels:
    app: cometchatfs
spec:
  # ClusterIP — the shared seaweedfs nginx proxies to this on :3300.
  type: ClusterIP
  selector:
    app: cometchatfs
  ports:
    - name: http
      port: 3300
      targetPort: 3300
      protocol: TCP
