apiVersion: apps/v1
kind: Deployment
metadata:
  name: cometchatfs
  labels:
    app: cometchatfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cometchatfs
  template:
    metadata:
      labels:
        app: cometchatfs
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        # ---- Next.js app (TLS + ingress handled by the shared seaweedfs nginx/LB) ----
        - name: cometchatfs
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/cometchat-enterprise:cometchatfs-obf@sha256:122cbf6d95244ad043896f283b9b17fe526b25534580601cb72dafcc79ee495b
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3300
          envFrom:
            - secretRef:
                name: cometchatfs-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /login
              port: 3300
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3300
            initialDelaySeconds: 15
            periodSeconds: 20
