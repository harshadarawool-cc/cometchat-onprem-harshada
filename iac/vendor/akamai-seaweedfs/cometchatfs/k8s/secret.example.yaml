# Copy to secret.yaml, fill in real values, then:  kubectl -n <ns> apply -f secret.yaml
# Do NOT commit the filled-in secret.yaml.
#
# __S3_HOST__      = the client's S3 endpoint host (e.g. media.client.example.com)
# JWT_SECRET       = openssl rand -hex 32
# S3_ACCESS/SECRET = the CONSOLE (Admin) key from seaweedfs/40-s3-secret.yaml (NOT the apps key)
# APP_USERS passwords are scrypt HASHES — generate with:
#     node scripts/hash-password.mjs 'the-password'   ->  scrypt:<salt>:<hash>
# Optional: FEATURE_BUCKET_VISIBILITY="true" re-enables public/private bucket controls
#     (leave unset on SeaweedFS 3.80 — it lacks S3 bucket ACL, so the controls stay hidden).
# Optional: PUBLIC_BUCKETS — comma-separated buckets that are public via the s3config `anonymous`
#     identity; the console shows a read-only Public/Private badge from this list. Keep in sync with
#     the `anonymous` identity in seaweedfs/40-s3-secret.yaml.
#     e.g. PUBLIC_BUCKETS: "assets,stickers,visual-chat-builder-app"
apiVersion: v1
kind: Secret
metadata:
  name: cometchatfs-env
  labels:
    app: cometchatfs
type: Opaque
stringData:
  S3_ENDPOINT: "https://__S3_HOST__"
  S3_PUBLIC_ENDPOINT: "https://__S3_HOST__"
  S3_REGION: "us-east-1"
  S3_ACCESS_KEY: "<S3_ACCESS_KEY>"
  S3_SECRET_KEY: "<S3_SECRET_KEY>"
  S3_FORCE_PATH_STYLE: "true"
  JWT_SECRET: "<openssl rand -hex 32>"
  APP_USERS: '[{"username":"admin","password":"scrypt:<salt>:<hash>","role":"admin"}]'
