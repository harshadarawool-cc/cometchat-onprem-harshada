# =============================================================================
# CometChat on-prem (GCP RKE2) — FRESH v3 TEST cluster (corrected foundation)
# -----------------------------------------------------------------------------
# Own VPC (cometchat-onprem-v3-vpc), own 10.23.x CIDRs, test-scale (1 of each
# datastore, 1 master + 3 workers). Built from cometchat-cluster2-rebuild plans
# (Steps 1-3): inbound-closed firewall, per-pod TLS sidecars, direct-to-Service
# CoreDNS, wildcard cert, full seeding, latest image digests, fresh DB creds.
# =============================================================================

# ---- GCP project / location ----
PROJECT="onprem-499712"
REGION="asia-south1"
ZONE="asia-south1-a"

# ---- Naming: own prefix + own VPC (isolated from -test/-v2/ghost) ----
PREFIX="cometchat-onprem-v3"

# ---- Private subnet CIDRs (own 10.23.x range — no collision) ----
SUBNET_DATA_CIDR="10.23.10.0/24"
SUBNET_CLUSTER_CIDR="10.23.20.0/24"
SUBNET_EDGE_CIDR="10.23.30.0/24"

# ---- SSH public key for Ansible (matches ansible/ssh/cometchat_rke2) ----
SSH_PUBLIC_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHTuuEXp45UT6PzeL2cJuh61hnHNdw+0vY9oP0ekQV0c ansible@cometchat"

# ---- Edge exposure (open during testing; tighten for prod) ----
EDGE_ALLOWED_CIDRS='["0.0.0.0/0"]'

# ---- RKE2 node sizing ----
# NOTE: control-plane HA (SERVER_COUNT=3) needs the rke2_server role to do etcd-join (first server
# cluster-init + servers 2/3 join via --server https://<first>:9345 + tls-san/API address). The role is
# single-server today, so KEEP SERVER_COUNT=1 until that's implemented + tested. Datastore HA is on (below).
RKE2_SERVER_COUNT=1
RKE2_SERVER_TYPE="e2-standard-2"
RKE2_AGENT_COUNT=3
RKE2_AGENT_TYPE="e2-standard-4"

# ---- Datastore sizing — HA scale (3-node each; redis count=3 => 12 VMs = 4 Sentinel clusters x 3) ----
#   Mongo rs0 (3 members) · Kafka KRaft quorum (3 brokers) · Redis Sentinel (3/cluster). MySQL/TiDB stay
#   single — their HA (InnoDB Cluster / TiDB PD+TiKV+TiDB) is the deferred pass (docs/HA-AND-SIZING-PLAN.md).
MONGO_COUNT=3;  MONGO_TYPE="e2-small";    MONGO_DISK=50
REDIS_COUNT=3;  REDIS_TYPE="e2-small"
KAFKA_COUNT=3;  KAFKA_TYPE="e2-small";    KAFKA_DISK=50
TIDB_COUNT=1;   TIDB_TYPE="e2-medium";    TIDB_DISK=50
MYSQL_COUNT=1;  MYSQL_TYPE="e2-small";    MYSQL_DISK=50

# ---- Disk type (pd-standard avoids SSD_TOTAL_GB quota) ----
DISK_TYPE="pd-standard"

# =============================================================================
# APP PHASE (used by ./deploy.sh app-all)
# =============================================================================
DOMAIN="cometchat-cluster-2.in"
LICENCE_FILE="/Users/harshada/prodction-kubenates/licences/licence-new.txt"
ECR_REGISTRY="894996064311.dkr.ecr.us-east-2.amazonaws.com"
ECR_REGION="us-east-2"
AWS_PROFILE="staging"
VAULT_ENVS_DIR="/tmp/cc-vault-envs-v3"

# ---- Split-horizon DNS: pinned ClusterIP that fronts ingress-nginx (must be free in the
#      RKE2 service CIDR, default 10.43.0.0/16). *.${DOMAIN} resolves here from inside the cluster.
INGRESS_INTERNAL_IP="10.43.200.10"

# ---- Data dumps: shipped IN-REPO (portable) during the seeding phase. Blank => self-provision.
MGMT_DUMP_SRC=""
MONGO_DUMP_SRC=""

# Route53 hosted zone for cometchat-cluster-2.in (staging profile) — used by dns-point.sh
R53_ZONE_ID="Z04640112BJ8TJHK3I2RI"
