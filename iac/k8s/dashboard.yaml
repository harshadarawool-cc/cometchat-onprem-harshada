# CometChat customer-dashboard (on-prem). The image ships a static React build that fetches
# /config.json at runtime (falls back to baked cc-cluster-1.io defaults if absent). We copy the
# build out of the image (initContainer) and serve it with nginx, overlaying our runtime config.json
# (REACT_APP_* values for this deployment). nginx config lives in dashboard-nginx.yaml (cm dashboard-nginx).
---
apiVersion: v1
kind: ConfigMap
metadata: { name: dashboard-config, namespace: cometchat }
data:
  config.json: |
    {
      "REACT_APP_IS_ONPREM": "true",
      "REACT_APP_CUSTOMER_DOMAIN": "https://apimgmt.cometchat-cluster-2.in/",
      "REACT_APP_ENABLE_GOOGLE_LOGIN": "true",
      "REACT_APP_ENABLE_GITHUB_LOGIN": "true",
      "REACT_APP_APP_CREATION_ALLOWED_EMAIL": "harshada.rawool@cometchat.com",
      "REACT_APP_VCB_BUILDER_HOST_URL": "cometchat-cluster-2.in",
      "REACT_APP_ONPREM_MEDIA_URL": "https://media-onprem.cometchat-cluster-2.in/"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: dashboard, namespace: cometchat, labels: { app.kubernetes.io/name: dashboard } }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: dashboard } }
  template:
    metadata: { labels: { app.kubernetes.io/name: dashboard } }
    spec:
      imagePullSecrets: [{ name: ecr-pull }]
      initContainers:
        - name: copy-build
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/on-prem-docker-images@sha256:fd2d877b093c4f7d26cfe4462bd76a34cbdd2e12a0089a2f47f857903bbb70aa  # :customer-dashboard (latest)
          command: ["sh","-c","cp -r /app/build/. /web/ 2>/dev/null || cp -r /usr/share/nginx/html/. /web/ 2>/dev/null || cp -r /app/dist/. /web/; echo copied $(find /web -type f | wc -l) files"]
          volumeMounts: [{ name: web, mountPath: /web }]
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: web, mountPath: /usr/share/nginx/html }
            - { name: cfg, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: appconfig, mountPath: /usr/share/nginx/html/config.json, subPath: config.json, readOnly: true }
          readinessProbe: { httpGet: { path: /nginx-health, port: 80 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 48Mi }, limits: { cpu: 200m, memory: 128Mi } }
      volumes:
        - { name: web, emptyDir: {} }
        - { name: cfg, configMap: { name: dashboard-nginx } }
        - { name: appconfig, configMap: { name: dashboard-config } }
---
apiVersion: v1
kind: Service
metadata: { name: dashboard, namespace: cometchat, labels: { app.kubernetes.io/name: dashboard } }
spec:
  selector: { app.kubernetes.io/name: dashboard }
  ports: [{ name: http, port: 80, targetPort: 80 }]
