# CometChat customer-dashboard (on-prem). The image is now SELF-SERVING + shell-less (hardened): it runs
# its own static server on :4000. So we run it directly (no build-copy initContainer — the image has no
# shell) behind an nginx TLS sidecar that terminates the wildcard cert on :443, overrides /config.json with
# our on-prem values, and rewrites the one hardcoded public host in the bundle. nginx config: dashboard-nginx.yaml.
---
apiVersion: v1
kind: ConfigMap
metadata: { name: dashboard-config, namespace: cometchat }
data:
  config.json: |
    {
      "REACT_APP_IS_ONPREM": "true",
      "REACT_APP_CUSTOMER_DOMAIN": "https://apimgmt.cometchat-cluster-2.in/",
      "REACT_APP_ENABLE_GOOGLE_LOGIN": "true",
      "REACT_APP_ENABLE_GITHUB_LOGIN": "true",
      "REACT_APP_APP_CREATION_ALLOWED_EMAIL": "harshada.rawool@cometchat.com",
      "REACT_APP_VCB_BUILDER_HOST_URL": "cometchat-cluster-2.in",
      "REACT_APP_ONPREM_MEDIA_URL": "https://media-onprem.cometchat-cluster-2.in/"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: dashboard, namespace: cometchat, labels: { app.kubernetes.io/name: dashboard } }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: dashboard } }
  template:
    metadata: { labels: { app.kubernetes.io/name: dashboard } }
    spec:
      imagePullSecrets: [{ name: ecr-pull }]
      containers:
        - name: dashboard
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/on-prem-docker-images@sha256:28078c3bbd84ebfeb08dce31916735baca1c6ddd77604d1efd4db895577c3457  # :customer-dashboard (self-serving :4000, shell-less)
          ports: [{ containerPort: 4000 }]
          readinessProbe: { tcpSocket: { port: 4000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 300m, memory: 256Mi } }
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }, { containerPort: 443 }]
          volumeMounts:
            - { name: cfg, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: appconfig, mountPath: /cfg/config.json, subPath: config.json, readOnly: true }
            - { name: tls, mountPath: /etc/nginx/ssl, readOnly: true }
          readinessProbe: { httpGet: { path: /nginx-health, port: 80 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 48Mi }, limits: { cpu: 200m, memory: 128Mi } }
      volumes:
        - { name: cfg, configMap: { name: dashboard-nginx } }
        - { name: appconfig, configMap: { name: dashboard-config } }
        - { name: tls, secret: { secretName: wildcard-tls } }
---
apiVersion: v1
kind: Service
metadata: { name: dashboard, namespace: cometchat, labels: { app.kubernetes.io/name: dashboard } }
spec:
  selector: { app.kubernetes.io/name: dashboard }
  ports: [{ name: http, port: 80, targetPort: 80 }, { name: https, port: 443, targetPort: 443 }]
