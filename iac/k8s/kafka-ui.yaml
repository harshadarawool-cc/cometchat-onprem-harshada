# Kafka UI (kafbat) — admin dashboard for the on-prem KRaft Kafka (brokers 10.20.10.31-33:9092).
# Runs IN-cluster (data stays internal). Access via: kubectl -n cometchat port-forward svc/kafka-ui 8080:8080
# NOT exposed via ingress (admin-only). Shows topics, consumer groups, per-partition lag, message payloads.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka-ui, namespace: cometchat, labels: { app.kubernetes.io/name: kafka-ui } }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kafka-ui } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kafka-ui } }
    spec:
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:latest
          env:
            - { name: KAFKA_CLUSTERS_0_NAME, value: cometchat-onprem }
            - { name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "10.20.10.31:9092,10.20.10.32:9092,10.20.10.33:9092" }
            - { name: DYNAMIC_CONFIG_ENABLED, value: "true" }
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 20, periodSeconds: 10, failureThreshold: 12 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka-ui, namespace: cometchat, labels: { app.kubernetes.io/name: kafka-ui } }
spec:
  selector: { app.kubernetes.io/name: kafka-ui }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
