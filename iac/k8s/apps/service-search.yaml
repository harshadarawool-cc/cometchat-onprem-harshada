# service-search (NestJS, Node) on GKE — ECR image, config via ENV.
# Image inspection: entry dist/main.js (NOT dist/src/), listens :3000, health GET /health-check,
# image USER uid 100/gid 101 (non-root). Config = env vars from Secret (datastore IPs already
# swapped). DEPENDENCY: needs Elasticsearch/OpenSearch (ELASTICSEARCH_NODE) which is NOT deployed
# yet — the pod will run but search calls will fail until that backend exists.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-search
  namespace: cometchat
  labels:
    app.kubernetes.io/name: service-search
    app.kubernetes.io/part-of: cometchat
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: service-search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-search
        app.kubernetes.io/part-of: cometchat
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: service-search
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/on-prem-docker-images@sha256:c05ddc1fe10715655f1807cdaf1d2067323ad48afee4d36aff1d3ab4ab2a2609
          # Native entrypoint (distroless: no shell). Image starts dist/main.js on :3000.
          envFrom:
            - secretRef: { name: service-search-env }
          ports:
            - { containerPort: 3000, name: http }
          startupProbe:
            httpGet: { path: /health-check, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health-check, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 4
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: service-search
  namespace: cometchat
  labels:
    app.kubernetes.io/name: service-search
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: service-search
  ports:
    - { name: http, port: 80, targetPort: 3000 }
