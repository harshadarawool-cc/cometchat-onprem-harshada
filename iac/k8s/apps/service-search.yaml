# service-search (NestJS, Node) on GKE — ECR image, config via ENV.
# Image inspection: entry dist/main.js (NOT dist/src/), listens :3000, health GET /health-check,
# image USER uid 100/gid 101 (non-root). Config = env vars from Secret (datastore IPs already
# swapped). DEPENDENCY: needs Elasticsearch/OpenSearch (ELASTICSEARCH_NODE) which is NOT deployed
# yet — the pod will run but search calls will fail until that backend exists.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-search
  namespace: cometchat
  labels:
    app.kubernetes.io/name: service-search
    app.kubernetes.io/part-of: cometchat
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: service-search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-search
        app.kubernetes.io/part-of: cometchat
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: service-search
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/on-prem-docker-images@sha256:c05ddc1fe10715655f1807cdaf1d2067323ad48afee4d36aff1d3ab4ab2a2609
          # Native entrypoint (distroless: no shell). Image starts dist/main.js on :3000.
          envFrom:
            - secretRef: { name: service-search-env }
          ports:
            - { containerPort: 3000, name: http }
          startupProbe:
            httpGet: { path: /health-check, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health-check, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 4
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: nginxhttp }, { containerPort: 443, name: https }]
          volumeMounts:
            - { name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
          readinessProbe: { httpGet: { path: /nginx-health, port: 80 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
      volumes:
        - { name: nginx-config, configMap: { name: service-search-nginx-config } }
        - { name: tls, secret: { secretName: wildcard-tls } }
---
apiVersion: v1
kind: Service
metadata:
  name: service-search
  namespace: cometchat
  labels:
    app.kubernetes.io/name: service-search
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: service-search
  ports:
    - { name: http, port: 80, targetPort: 80 }
    - { name: https, port: 443, targetPort: 443 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-search-nginx-config
  namespace: cometchat
  labels:
    app.kubernetes.io/name: service-search
data:
  default.conf: |
    server {
      listen 80; server_name _; client_max_body_size 50M;
      underscores_in_headers on; ignore_invalid_headers off;
      location = /nginx-health { access_log off; add_header Content-Type application/json; return 200 '{"status":"ok"}'; }
      location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
      }
    }
    # pod-TLS (colleague parity): terminate the wildcard cert on :443 so east-west calls (CoreDNS ->
    # Service ClusterIP:443) are real HTTPS verified against *.<domain>, not just ingress-terminated.
    server {
      listen 443 ssl; server_name _; client_max_body_size 50M;
      ssl_certificate /tls/tls.crt; ssl_certificate_key /tls/tls.key;
      underscores_in_headers on; ignore_invalid_headers off;
      location = /nginx-health { access_log off; add_header Content-Type application/json; return 200 '{"status":"ok"}'; }
      location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
      }
    }
