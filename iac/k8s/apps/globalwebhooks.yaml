# globalwebhooks / global_event_consumers (NestJS) on GKE — ECR image, config via ENV.
# Monorepo: main package packages/global_event_consumers; real entry is dist/src/main.js.
# Single process (no clustering). Array env vars are comma-separated (app does .split(',')).
# Health: /v1/webhooks/health-check (200) is the module's own health. (/v1/app/health pings the
# dlq/http-runner helpers on localhost:8082/8080, which aren't deployed — so we don't probe it.)
# Requires the per-app Mongo user `webhookuser` (created in rs0, readWrite on the `events` DB).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalwebhooks
  namespace: cometchat
  labels:
    app.kubernetes.io/name: globalwebhooks
    app.kubernetes.io/part-of: cometchat
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: globalwebhooks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: globalwebhooks
        app.kubernetes.io/part-of: cometchat
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: globalwebhooks
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/on-prem-docker-images@sha256:96a7e73b36760fa86974bdfac7ab42b78e8d51b5250dee4e2d0c3a61e0afbd45
          # Run the image's native entrypoint (distroless: no shell). It already cds to
          # packages/global_event_consumers and starts dist/src/main.
          envFrom:
            - secretRef: { name: globalwebhooks-env }
          ports:
            - { containerPort: 3006, name: http }
          startupProbe:
            httpGet: { path: /v1/webhooks/health-check, port: 3006 }
            periodSeconds: 10
            failureThreshold: 30      # up to ~5 min for Kafka/Mongo connects
          readinessProbe:
            httpGet: { path: /v1/webhooks/health-check, port: 3006 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3006 }   # process alive (don't restart for a transient health blip)
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 4
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }, { containerPort: 443, name: https }]
          volumeMounts:
            - { name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
          readinessProbe: { httpGet: { path: /nginx-health, port: 80 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
      volumes:
        - { name: nginx-config, configMap: { name: globalwebhooks-nginx-config } }
        - { name: tls, secret: { secretName: wildcard-tls } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: globalwebhooks-nginx-config
  namespace: cometchat
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      client_max_body_size 50M;
      underscores_in_headers on;
      ignore_invalid_headers off;
      location = /nginx-health { access_log off; add_header Content-Type application/json; return 200 '{"status":"ok"}'; }
      location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
      }
    }
    server {
      listen 443 ssl;
      server_name _;
      client_max_body_size 50M;
      ssl_certificate /tls/tls.crt;
      ssl_certificate_key /tls/tls.key;
      underscores_in_headers on;
      ignore_invalid_headers off;
      location = /nginx-health { access_log off; add_header Content-Type application/json; return 200 '{"status":"ok"}'; }
      location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: globalwebhooks
  namespace: cometchat
  labels:
    app.kubernetes.io/name: globalwebhooks
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: globalwebhooks
  ports:
    - { name: http, port: 80, targetPort: 80 }
    - { name: https, port: 443, targetPort: 443 }
