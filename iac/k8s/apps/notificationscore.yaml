# notificationscore (NestJS) on GKE — ECR image, config via ENV (no baked .env).
# Runs the image's NATIVE entrypoint (latest build is distroless: no shell, so no command
# override / --require shim). The previous single-cpu shim (to force the single-process path)
# is removed — the image works as-is in the reference cluster.
---
# nginx sidecar config — pod-TLS: :80 plain front + :443 wildcard-cert front. Proxies to app on 127.0.0.1:3100.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notificationscore-nginx-config
  namespace: cometchat
data:
  default.conf: |
    server {
      listen 80; server_name _; client_max_body_size 50M;
      underscores_in_headers on; ignore_invalid_headers off;
      location = /nginx-health { access_log off; add_header Content-Type application/json; return 200 '{"status":"ok"}'; }
      location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
      }
    }
    # pod-TLS: terminate the wildcard cert on :443 so east-west calls (CoreDNS ->
    # Service ClusterIP:443) are real HTTPS verified against *.<domain>, not just ingress-terminated.
    server {
      listen 443 ssl; server_name _; client_max_body_size 50M;
      ssl_certificate /tls/tls.crt; ssl_certificate_key /tls/tls.key;
      underscores_in_headers on; ignore_invalid_headers off;
      location = /nginx-health { access_log off; add_header Content-Type application/json; return 200 '{"status":"ok"}'; }
      location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificationscore
  namespace: cometchat
  labels:
    app.kubernetes.io/name: notificationscore
    app.kubernetes.io/part-of: cometchat
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: notificationscore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notificationscore
        app.kubernetes.io/part-of: cometchat
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notificationscore
          # NOTE: notificationscore-hardened-distroless (06-24) was trialed and CRASHES on boot —
          # Node20 + newer path-to-regexp rejects the app's own route '/sms/v1/providers(/dashboard)?/twilio'.
          # Reverted to the working standard build. (Standard build accepts startup but rejects the
          # message-event DTO — both are dev/image bugs; see docs/PROBLEMS-AND-FIXES.md.)
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/on-prem-docker-images@sha256:2dc5eb05326be026b6fcab4970314811d481690b676aa4148356402154337ce9
          # All config comes from the Secret as environment variables (datastore IPs already
          # swapped to *.db.internal).
          envFrom:
            - secretRef: { name: notificationscore-env }
          ports:
            - { containerPort: 3100, name: http }
          # /health-check only answers once the app has connected Kafka/Mongo/Redis and is listening.
          startupProbe:
            httpGet: { path: /health-check, port: 3100 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30      # up to ~5 min for datastore connects
          readinessProbe:
            httpGet: { path: /health-check, port: 3100 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health-check, port: 3100 }
            periodSeconds: 20
            failureThreshold: 4
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        # nginx sidecar — pod-TLS: :80 plain + :443 wildcard cert. Proxies / -> app on 127.0.0.1:3100.
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }, { containerPort: 443, name: https }]
          volumeMounts:
            - { name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
          readinessProbe: { httpGet: { path: /nginx-health, port: 80 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
      volumes:
        - { name: nginx-config, configMap: { name: notificationscore-nginx-config } }
        - { name: tls, secret: { secretName: wildcard-tls } }
---
apiVersion: v1
kind: Service
metadata:
  name: notificationscore
  namespace: cometchat
  labels:
    app.kubernetes.io/name: notificationscore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notificationscore
  ports:
    # port 80/443 now front the nginx sidecar (targetPort 80/443).
    - { name: http, port: 80, targetPort: 80 }
    - { name: https, port: 443, targetPort: 443 }