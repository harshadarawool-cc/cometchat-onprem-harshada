# notificationscore (NestJS) on GKE — ECR image, config via ENV (no baked .env).
# Runs the image's NATIVE entrypoint (latest build is distroless: no shell, so no command
# override / --require shim). The previous single-cpu shim (to force the single-process path)
# is removed — the image works as-is in the reference cluster.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificationscore
  namespace: cometchat
  labels:
    app.kubernetes.io/name: notificationscore
    app.kubernetes.io/part-of: cometchat
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: notificationscore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notificationscore
        app.kubernetes.io/part-of: cometchat
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notificationscore
          # NOTE: notificationscore-hardened-distroless (06-24) was trialed and CRASHES on boot —
          # Node20 + newer path-to-regexp rejects the app's own route '/sms/v1/providers(/dashboard)?/twilio'.
          # Reverted to the working standard build. (Standard build accepts startup but rejects the
          # message-event DTO — both are dev/image bugs; see docs/PROBLEMS-AND-FIXES.md.)
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/on-prem-docker-images@sha256:2dc5eb05326be026b6fcab4970314811d481690b676aa4148356402154337ce9
          # All config comes from the Secret as environment variables (datastore IPs already
          # swapped to *.db.internal).
          envFrom:
            - secretRef: { name: notificationscore-env }
          ports:
            - { containerPort: 3100, name: http }
          # /health-check only answers once the app has connected Kafka/Mongo/Redis and is listening.
          startupProbe:
            httpGet: { path: /health-check, port: 3100 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30      # up to ~5 min for datastore connects
          readinessProbe:
            httpGet: { path: /health-check, port: 3100 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health-check, port: 3100 }
            periodSeconds: 20
            failureThreshold: 4
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: notificationscore
  namespace: cometchat
  labels:
    app.kubernetes.io/name: notificationscore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notificationscore
  ports:
    - { name: http, port: 80, targetPort: 3100 }