# vercel-agent — Vercel CometChat Agent (BYOA sample) for the CometChat AI-agent platform.
# WHAT: a small Node/TS Express app (@ai-sdk/openai + @cometchat/vercel-adapter, `ai` SDK). It
#   exposes POST /agent (SSE stream), GET /health, GET /  and listens on :4000. The platform's
#   ai-agent-service (east-west, bare pod :4002) proxies chat to registered BYOA agents; THIS is
#   one such agent. Flow:  CometChat client -> ai-agent-service -> vercel-agent -> OpenAI.
#
# BUILD METHOD (registry-free — no local docker, no ECR push):
#   The prebuilt dist/ + package.json + package-lock.json (~40KB) are shipped as a base64 tarball
#   in the vercel-agent-src ConfigMap (below, ~53KB — well under the 1MB CM limit). An initContainer
#   (node:20) decodes+extracts it into a shared emptyDir and runs `npm ci --omit=dev` (prod deps are
#   pulled from npmjs over the nodes' NAT egress). The main container (node:20) then runs
#   `node dist/server.js` from that same volume. This avoids needing docker to build+push an image.
#   If in-cluster npm ever proves flaky, the documented fallback is kaniko -> ECR image (not used here).
#
# EXPOSURE: BARE pod (no per-pod nginx/TLS sidecar) — identical posture to its caller
#   ai-agent-service, which reaches it east-west over plain HTTP. Service :80 -> 4000 (+ :4000 app
#   port for parity). No public TLS/HAProxy front is added here; see the deploy report for how to
#   register it in the dashboard "Connect Agent" screen.
#
# CONFIG: OPENAI_API_KEY / OPENAI_MODEL=gpt-4o / PORT=4000 / NODE_ENV=production live in the
#   vercel-agent-env Secret (credential — NOT a ConfigMap). server.js reads OPENAI_MODEL (defaults
#   to gpt-4o-mini if unset), so OPENAI_MODEL=gpt-4o is set explicitly. The stale dist/.env is
#   excluded from the tarball so the Secret is the single source of env truth.
#
# WIRING: picked up automatically by deploy.sh phase_apps (`for f in k8s/apps/*.yaml; do kc apply`).
---
apiVersion: v1
kind: Secret
metadata:
  name: vercel-agent-env
  namespace: cometchat
  labels:
    app.kubernetes.io/name: vercel-agent
    app.kubernetes.io/part-of: cometchat
type: Opaque
stringData:
  # AIR-GAPPED / OLLAMA WIRING (updated 2026-07-02):
  #   The agent now talks to the in-cluster Ollama (OpenAI-compatible) instead of api.openai.com,
  #   so no external OpenAI key is needed. server.ts builds the provider via
  #   `createOpenAI({ baseURL: OPENAI_BASE_URL, apiKey: OPENAI_API_KEY })` and calls
  #   `openai.chat(OPENAI_MODEL)` — the Chat Completions API (/v1/chat/completions), the only
  #   OpenAI-surface Ollama implements (the default openai(model) call would hit the Responses
  #   API /v1/responses, which Ollama does NOT serve).
  #   OPENAI_API_KEY is a dummy — Ollama ignores it, but the SDK still requires a non-empty value.
  #   MODEL DEPENDENCY: Ollama MUST have OPENAI_MODEL pulled. deploy.sh pulls it idempotently
  #   (see phase after apps: `ollama pull llama3.2:3b`). To use a different model, change
  #   OPENAI_MODEL here AND ensure that tag is pulled into the ollama pod.
  OPENAI_BASE_URL: "http://ollama.cometchat.svc.cluster.local:11434/v1"
  OPENAI_API_KEY: "ollama"
  OPENAI_MODEL: "llama3.2:3b"
  PORT: "4000"
  NODE_ENV: "production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vercel-agent-src
  namespace: cometchat
  labels:
    app.kubernetes.io/name: vercel-agent
    app.kubernetes.io/part-of: cometchat
# app.tgz.b64: base64 of `tar czf - dist package.json package-lock.json` (dist/.env excluded).
# The initContainer base64 -d | tar xz into /app, then `npm ci --omit=dev`.
data:
  app.tgz.b64: |
    
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vercel-agent
  namespace: cometchat
  labels:
    app.kubernetes.io/name: vercel-agent
    app.kubernetes.io/part-of: cometchat
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: vercel-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vercel-agent
        app.kubernetes.io/part-of: cometchat
      annotations:
        # bump this to force a rollout when the src ConfigMap changes (CM edits don't restart pods).
        checksum/src: "f0a009546ee4"
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Unpack the app tarball into the shared /app volume, then install PROD deps from npmjs
        # (nodes have NAT egress). Prefer `npm ci` (lockfile-exact); fall back to `npm install`
        # if the lockfile and package.json ever drift. --omit=dev = no tsx/typescript/@vercel.
        - name: install-deps
          image: node:20
          workingDir: /app
          command: ["sh","-c"]
          args:
            - |
              set -eu
              echo "[init] extracting app source into /app ..."
              base64 -d /src/app.tgz.b64 > /tmp/app.tgz
              tar xzf /tmp/app.tgz -C /app
              ls -la /app /app/dist
              echo "[init] installing production dependencies ..."
              npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund
              echo "[init] node_modules ready:"
              ls /app/node_modules | head -5
              echo "[init] done."
          volumeMounts:
            - { name: app, mountPath: /app }
            - { name: src, mountPath: /src, readOnly: true }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: vercel-agent
          image: node:20
          workingDir: /app
          command: ["node","dist/server.js"]
          envFrom:
            - secretRef: { name: vercel-agent-env }
          # Shared /app populated by the install-deps initContainer (dist/ + node_modules).
          volumeMounts:
            - { name: app, mountPath: /app }
          ports:
            - { containerPort: 4000, name: http }
          startupProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 4000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - { name: app, emptyDir: {} }
        - { name: src, configMap: { name: vercel-agent-src } }
---
apiVersion: v1
kind: Service
metadata:
  name: vercel-agent
  namespace: cometchat
  labels:
    app.kubernetes.io/name: vercel-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vercel-agent
  ports:
    - { name: http, port: 80, targetPort: 4000 }
    - { name: app, port: 4000, targetPort: 4000 }
