# Collaborative editors behind the extensions service:
#   document-embed = CometChat-customised Etherpad 1.8.4 (:9001) — pads in mgmt MySQL (etherpad DB)
#   whiteboard     = cracker0dks/whiteboard v1.0.0 (:9000) — stateless, accessToken "board"
# The /v1/create APIs (document-onprem / whiteboard-onprem) are served by the EXTENSIONS service,
# not these editors. These two only serve the editor iframes (document-embed-onprem / whiteboard-embed-onprem).
# Images are pinned by digest from OUR ECR (mirrored from akamai Harbor — no VPN needed).
# Settings secret `document-embed-settings` (carries the MySQL password) is created by deploy.sh
# from .secrets/etherpad/ (NOT committed). Whiteboard config has no secrets -> ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata: { name: whiteboard-config, namespace: cometchat }
data:
  config.default.yml: |
    # Collaborative whiteboard config. accessToken is the shared secret with the extensions
    # service (extensions signs whiteboard URLs with it). Keep "board" unless changed in both places.
    backend:
      accessToken: "board"
      enableWebdav: false
      performance:
        whiteboardInfoBroadcastFreq: 1
    frontend:
      onWhiteboardLoad:
        setReadOnly: false
        displayInfo: false
      showSmallestScreenIndicator: true
      imageDownloadFormat: "jpeg"
      drawBackgroundGrid: false
      backgroundGridImage: "bg_grid.png"
      performance:
        refreshInfoFreq: 5
        pointerEventsThrottling:
          - { fromUserCount: 0,  minDistDelta: 1, maxFreq: 30 }
          - { fromUserCount: 10, minDistDelta: 5, maxFreq: 10 }
---
# pod-TLS sidecar config for the Etherpad editor iframe (facing: document-embed-onprem).
# WebSocket variant — Etherpad uses long-lived WS for collaborative editing.
apiVersion: v1
kind: ConfigMap
metadata: { name: document-embed-nginx, namespace: cometchat }
data:
  default.conf: |
    server {
      listen 80;
      listen 443 ssl;
      server_name _;
      ssl_certificate     /etc/nginx/ssl/tls.crt;
      ssl_certificate_key /etc/nginx/ssl/tls.key;
      underscores_in_headers on; ignore_invalid_headers off;
      client_max_body_size 50M;
      location = /nginx-health { access_log off; return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
      location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Expect "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60;
        proxy_read_timeout 86400s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: document-embed, namespace: cometchat, labels: { app: document-embed } }
spec:
  replicas: 1
  selector: { matchLabels: { app: document-embed } }
  template:
    metadata: { labels: { app: document-embed } }
    spec:
      imagePullSecrets: [{ name: ecr-pull-secret }]
      containers:
        - name: document-embed
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/on-prem-docker-images@sha256:14fdbea7cfa6b0dad03324226369d1ad5d3b8466a7480dcde74b4fe1ceb1630b  # :document-embed (user-pinned 2026-07-02)
          imagePullPolicy: IfNotPresent
          env:
            - { name: NODE_ENV, value: production }
          ports: [{ containerPort: 9001, name: http }]
          volumeMounts:
            - { name: settings, mountPath: /app/settings.json, subPath: settings.json, readOnly: true }
            - { name: var, mountPath: /app/var }   # minify cache; pads live in MySQL
          readinessProbe: { tcpSocket: { port: 9001 }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe:  { tcpSocket: { port: 9001 }, initialDelaySeconds: 40, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
        # db-proxy: the Etherpad image's startup gate waits on MySQL at 127.0.0.1:3306, so forward that
        # to the real MySQL VM. IP is this cluster's mysql_host (10.24.10.41 = SUBNET_DATA + .41);
        # update if SUBNET_DATA_CIDR changes. (socat entrypoint = socat, so args are socat args — no shell.)
        - name: db-proxy
          image: alpine/socat
          args: ["TCP-LISTEN:3306,fork,reuseaddr", "TCP:10.24.10.41:3306"]
          ports: [{ containerPort: 3306 }]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
        - name: nginx-tls
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }, { containerPort: 443, name: https }]
          volumeMounts:
            - { name: nginx-tls-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tls, mountPath: /etc/nginx/ssl, readOnly: true }
          readinessProbe: { httpGet: { path: /nginx-health, port: 80 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
      volumes:
        - name: settings
          secret: { secretName: document-embed-settings }
        - name: var
          emptyDir: {}
        - { name: nginx-tls-conf, configMap: { name: document-embed-nginx } }
        - { name: tls, secret: { secretName: wildcard-tls } }
---
apiVersion: v1
kind: Service
metadata: { name: document-embed, namespace: cometchat, labels: { app: document-embed } }
spec:
  selector: { app: document-embed }
  # http:80 (east-west/sidecar) + https:443 (pod-TLS for the HAProxy SNI edge). Both hit the sidecar.
  ports:
    - { name: http, port: 80, targetPort: 80 }
    - { name: https, port: 443, targetPort: 443 }
---
# pod-TLS sidecar config for the whiteboard editor iframe (facing: whiteboard-embed-onprem).
apiVersion: v1
kind: ConfigMap
metadata: { name: whiteboard-nginx, namespace: cometchat }
data:
  default.conf: |
    server {
      listen 80;
      listen 443 ssl;
      server_name _;
      ssl_certificate     /etc/nginx/ssl/tls.crt;
      ssl_certificate_key /etc/nginx/ssl/tls.key;
      underscores_in_headers on; ignore_invalid_headers off;
      client_max_body_size 50M;
      location = /nginx-health { access_log off; return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
      location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Expect "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60;
        proxy_read_timeout 86400s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: whiteboard, namespace: cometchat, labels: { app: whiteboard } }
spec:
  replicas: 1
  selector: { matchLabels: { app: whiteboard } }
  template:
    metadata: { labels: { app: whiteboard } }
    spec:
      imagePullSecrets: [{ name: ecr-pull-secret }]
      containers:
        - name: whiteboard
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/on-prem-docker-images@sha256:91cf6c6905a1936fae8da158383335f12e2598c3de8dc7ed20d66d29e582d7e4  # :whiteboard (user-pinned 2026-07-02)
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/server.js", "--mode=production", "--config=config.default.yml"]
          env:
            - { name: NODE_ENV, value: production }
          ports: [{ containerPort: 9000, name: http }]
          volumeMounts:
            - { name: config, mountPath: /app/config.default.yml, subPath: config.default.yml, readOnly: true }
          readinessProbe: { tcpSocket: { port: 9000 }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe:  { tcpSocket: { port: 9000 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 300m, memory: 256Mi } }
        - name: nginx-tls
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }, { containerPort: 443, name: https }]
          volumeMounts:
            - { name: nginx-tls-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tls, mountPath: /etc/nginx/ssl, readOnly: true }
          readinessProbe: { httpGet: { path: /nginx-health, port: 80 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
      volumes:
        - name: config
          configMap: { name: whiteboard-config }
        - { name: nginx-tls-conf, configMap: { name: whiteboard-nginx } }
        - { name: tls, secret: { secretName: wildcard-tls } }
---
apiVersion: v1
kind: Service
metadata: { name: whiteboard, namespace: cometchat, labels: { app: whiteboard } }
spec:
  selector: { app: whiteboard }
  ports:
    - { name: http, port: 80, targetPort: 80 }
    - { name: https, port: 443, targetPort: 443 }
