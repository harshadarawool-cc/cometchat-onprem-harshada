# Collaborative editors behind the extensions service:
#   document-embed = CometChat Etherpad 3.3.2 / TypeScript (:9001) — pads in mgmt MySQL (etherpad DB)
#   whiteboard     = cracker0dks/whiteboard v1.0.0 (:9000) — stateless, accessToken "board"
#
# ✅ WORKING (fixed 2026-07-03). The image's stock entrypoint.sh hardcodes
#   `node .../ep_etherpad-lite/node/server.js` — a path that only exists in OLD (1.x) Etherpad. This build
#   is Etherpad 3.3.2 (TypeScript): only node/server.ts ships (no compiled .js), so the stock entrypoint
#   CrashLoops with MODULE_NOT_FOUND. FIX (config-only, no image patch): the document-embed container below
#   overrides `command` to the image's OWN correct launcher — `node --require tsx/cjs node/server.ts`
#   (= its `pnpm prod`) — and sets DB_* env so Etherpad's settings.json (${ENV}-substituted) points at our
#   provisioned etherpad DB. DB_PASS comes from the `etherpad-db` secret. Verified: boots, runs migrations,
#   listens :9001, serves the editor over document-embed-onprem (HTTP 200 through the edge).
#   The socat db-proxy sidecar (below) is now OPTIONAL — DB_HOST points straight at the mgmt MySQL VM.
# The /v1/create APIs (document-onprem / whiteboard-onprem) are served by the EXTENSIONS service,
# not these editors. These two only serve the editor iframes (document-embed-onprem / whiteboard-embed-onprem).
# Images are pinned by digest from OUR ECR (mirrored from akamai Harbor — no VPN needed).
# Settings secret `document-embed-settings` (carries the MySQL password) is created by deploy.sh
# from .secrets/etherpad/ (NOT committed). Whiteboard config has no secrets -> ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata: { name: whiteboard-config, namespace: cometchat }
data:
  config.default.yml: |
    # Collaborative whiteboard config. accessToken is a SERVER-INTERACTION GATE: the whiteboard server
    # requires the client's ?accesstoken=<x> to MATCH this value. OUR extensions build (25b229c1) appends
    # `&accesstoken=board` to the embed URL (confirmed in a captured request), so this MUST be "board" —
    # blanking it makes "board" != "" => "Access denied! Wrong accessToken!". (The handoff blanked it
    # because ITS extensions build sent no accesstoken; ours differs — verified empirically 2026-07-03.)
    backend:
      accessToken: "board"
      enableWebdav: false
      performance:
        whiteboardInfoBroadcastFreq: 1
    frontend:
      onWhiteboardLoad:
        setReadOnly: false
        displayInfo: false
      showSmallestScreenIndicator: true
      imageDownloadFormat: "jpeg"
      drawBackgroundGrid: false
      backgroundGridImage: "bg_grid.png"
      performance:
        refreshInfoFreq: 5
        pointerEventsThrottling:
          - { fromUserCount: 0,  minDistDelta: 1, maxFreq: 30 }
          - { fromUserCount: 10, minDistDelta: 5, maxFreq: 10 }
---
# pod-TLS sidecar config for the Etherpad editor iframe (facing: document-embed-onprem).
# WebSocket variant — Etherpad uses long-lived WS for collaborative editing.
apiVersion: v1
kind: ConfigMap
metadata: { name: document-embed-nginx, namespace: cometchat }
data:
  default.conf: |
    server {
      listen 80;
      listen 443 ssl;
      server_name _;
      ssl_certificate     /etc/nginx/ssl/tls.crt;
      ssl_certificate_key /etc/nginx/ssl/tls.key;
      underscores_in_headers on; ignore_invalid_headers off;
      client_max_body_size 50M;
      location = /nginx-health { access_log off; return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
      location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Expect "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60;
        proxy_read_timeout 86400s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: document-embed, namespace: cometchat, labels: { app: document-embed } }
spec:
  replicas: 1
  selector: { matchLabels: { app: document-embed } }
  template:
    metadata: { labels: { app: document-embed } }
    spec:
      imagePullSecrets: [{ name: ecr-pull-secret }]
      containers:
        - name: document-embed
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/on-prem-docker-images@sha256:f56a25001dc7a27c32761aa30a83107deee67de8774051cef03cf8d87885adf0  # :document-embed (user-pinned 2026-07-03; source Azure ACR cometchatakstest.azurecr.io/cometchat-onprem/document-embed — MUST be mirrored to this ECR repo or it ImagePullBackOffs)
          imagePullPolicy: IfNotPresent
          # The image's entrypoint.sh hardcodes `node .../ep_etherpad-lite/node/server.js` — a path that
          # only exists in OLD (1.x) Etherpad. This is Etherpad 3.3.2 (TypeScript): only node/server.ts
          # ships, so the stock entrypoint CrashLoops (MODULE_NOT_FOUND). Override to the image's OWN correct
          # launcher (= `pnpm prod` = node --require tsx/cjs node/server.ts). Config-only, no image patch.
          # ONE remaining in-container edit: Etherpad's PadManager caps padId at 50 chars ({1,50}); CometChat
          # padIds are ~196-char signed JWTs -> HTTP 404 "Such a padname is forbidden". Widen to 500. This is
          # an app-code regex with no config/DB lever — the clean end-state is CometChat emitting a SHORT
          # padId (tracked as an upstream image bug). The store-KEY width ("Data too long for column 'key'"
          # on save) is fixed at the DATA layer instead: etherpad-db-init.job.yaml widens store.key to
          # VARCHAR(512) on the live DB — no ueberdb2 code patch needed (the in-code guard never fires; the
          # MySQL column width was the real limit).
          command:
            - sh
            - -c
            - |
              cd /opt/etherpad-lite/src
              sed -i 's/{1,50}/{1,500}/' node/db/PadManager.ts 2>/dev/null || true
              exec node --require tsx/cjs node/server.ts
          # Etherpad resolves its DB from settings.json via ${ENV} substitution -> point at OUR provisioned
          # etherpad DB (phase_editors + etherpad-db-init created it on mgmt MySQL). DB_PASS = etherpad-db secret.
          env:
            - { name: NODE_ENV, value: production }
            - { name: DB_TYPE, value: mysql }
            - { name: DB_HOST, value: "10.24.10.41" }   # mgmt MySQL VM (direct; db-proxy sidecar now optional)
            - { name: DB_PORT, value: "3306" }
            - { name: DB_NAME, value: etherpad }
            - { name: DB_USER, value: etherpaduser }
            - { name: DB_CHARSET, value: utf8mb4 }
            - { name: PORT, value: "9001" }
            - name: DB_PASS
              valueFrom: { secretKeyRef: { name: etherpad-db, key: password } }
          ports: [{ containerPort: 9001, name: http }]
          volumeMounts:
            - { name: settings, mountPath: /app/settings.json, subPath: settings.json, readOnly: true }
            - { name: var, mountPath: /app/var }   # minify cache; pads live in MySQL
          # Etherpad 3.x boots in ~25-30s (plugin migration on every start) — give probes headroom.
          readinessProbe: { tcpSocket: { port: 9001 }, initialDelaySeconds: 30, periodSeconds: 10, failureThreshold: 12 }
          livenessProbe:  { tcpSocket: { port: 9001 }, initialDelaySeconds: 90, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 768Mi } }
        # db-proxy: the Etherpad image's startup gate waits on MySQL at 127.0.0.1:3306, so forward that
        # to the real MySQL VM. IP is this cluster's mysql_host (10.24.10.41 = SUBNET_DATA + .41);
        # update if SUBNET_DATA_CIDR changes. (socat entrypoint = socat, so args are socat args — no shell.)
        - name: db-proxy
          image: alpine/socat
          args: ["TCP-LISTEN:3306,fork,reuseaddr", "TCP:10.24.10.41:3306"]
          ports: [{ containerPort: 3306 }]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
        - name: nginx-tls
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }, { containerPort: 443, name: https }]
          volumeMounts:
            - { name: nginx-tls-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tls, mountPath: /etc/nginx/ssl, readOnly: true }
          readinessProbe: { httpGet: { path: /nginx-health, port: 80 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
      volumes:
        - name: settings
          secret: { secretName: document-embed-settings }
        - name: var
          emptyDir: {}
        - { name: nginx-tls-conf, configMap: { name: document-embed-nginx } }
        - { name: tls, secret: { secretName: wildcard-tls } }
---
apiVersion: v1
kind: Service
metadata: { name: document-embed, namespace: cometchat, labels: { app: document-embed } }
spec:
  selector: { app: document-embed }
  # http:80 (east-west/sidecar) + https:443 (pod-TLS for the HAProxy SNI edge). Both hit the sidecar.
  ports:
    - { name: http, port: 80, targetPort: 80 }
    - { name: https, port: 443, targetPort: 443 }
---
# pod-TLS sidecar config for the whiteboard editor iframe (facing: whiteboard-embed-onprem).
apiVersion: v1
kind: ConfigMap
metadata: { name: whiteboard-nginx, namespace: cometchat }
data:
  default.conf: |
    server {
      listen 80;
      listen 443 ssl;
      server_name _;
      ssl_certificate     /etc/nginx/ssl/tls.crt;
      ssl_certificate_key /etc/nginx/ssl/tls.key;
      underscores_in_headers on; ignore_invalid_headers off;
      client_max_body_size 50M;
      location = /nginx-health { access_log off; return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
      location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Expect "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60;
        proxy_read_timeout 86400s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: whiteboard, namespace: cometchat, labels: { app: whiteboard } }
spec:
  replicas: 1
  selector: { matchLabels: { app: whiteboard } }
  template:
    metadata: { labels: { app: whiteboard } }
    spec:
      imagePullSecrets: [{ name: ecr-pull-secret }]
      containers:
        - name: whiteboard
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/on-prem-docker-images@sha256:91cf6c6905a1936fae8da158383335f12e2598c3de8dc7ed20d66d29e582d7e4  # :whiteboard (user-pinned 2026-07-02)
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/server.js", "--mode=production", "--config=config.default.yml"]
          env:
            - { name: NODE_ENV, value: production }
          ports: [{ containerPort: 9000, name: http }]
          volumeMounts:
            - { name: config, mountPath: /app/config.default.yml, subPath: config.default.yml, readOnly: true }
          readinessProbe: { tcpSocket: { port: 9000 }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe:  { tcpSocket: { port: 9000 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 300m, memory: 256Mi } }
        - name: nginx-tls
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }, { containerPort: 443, name: https }]
          volumeMounts:
            - { name: nginx-tls-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tls, mountPath: /etc/nginx/ssl, readOnly: true }
          readinessProbe: { httpGet: { path: /nginx-health, port: 80 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
      volumes:
        - name: config
          configMap: { name: whiteboard-config }
        - { name: nginx-tls-conf, configMap: { name: whiteboard-nginx } }
        - { name: tls, secret: { secretName: wildcard-tls } }
---
apiVersion: v1
kind: Service
metadata: { name: whiteboard, namespace: cometchat, labels: { app: whiteboard } }
spec:
  selector: { app: whiteboard }
  ports:
    - { name: http, port: 80, targetPort: 80 }
    - { name: https, port: 443, targetPort: 443 }
