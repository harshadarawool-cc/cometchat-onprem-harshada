# One-shot seed Job — pre-fills the public buckets with the bundled CometChat assets
# (AI-agent icons, sample-app avatars, default stickers, VCB export zips) and creates the
# private `uploads` bucket. Idempotent: re-running skips any prefix that already has objects.
#
# NOTE (default stickers): the 202 default sticker PNGs (14 packs) are ALSO seeded EARLY and
# authoritatively by deploy.sh `phase_stickers_seed` (repo seed/stickers/ -> stickers/<pack>/<file>.png
# via internal `weed filer.copy`, no DNS/cert needed). That repo copy is the source of truth — this
# late image-baked job is a belt-and-suspenders fallback for the same stickers/ prefix and is a no-op
# once phase_stickers_seed has populated the bucket (idempotent skip-if-present).
#
# RUN ORDER: apply this LAST — after cometchatFS + edge nginx are up and DNS resolves
# media-onprem.cometchat-cluster-2.in (the seeder signs S3 requests against that host, matching S3_EXTERNAL_URL).
# Uses the CONSOLE (Admin) S3 key from the cometchatfs-env secret (apps key can't create buckets).
# Placeholders: cometchat media-onprem.cometchat-cluster-2.in
apiVersion: batch/v1
kind: Job
metadata:
  name: cometchatfs-seed
  namespace: cometchat
  labels: { app: cometchatfs, component: seed }
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600 # auto-remove the finished Job after 10 min
  template:
    metadata:
      labels: { app: cometchatfs, component: seed }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      imagePullSecrets: [{ name: ecr-pull-secret }]
      containers:
        - name: seed
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/cometchat-enterprise:cometchatfs-seed@sha256:aacf9de81d7b282afa4a32a693d3dd31f60b6300a821bd45d38a8b09dc3477a4
          imagePullPolicy: IfNotPresent
          env:
            - name: S3_ENDPOINT
              value: "https://media-onprem.cometchat-cluster-2.in"
            # CONSOLE (Admin) key — reused from the console's secret. Admin is needed to create buckets.
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: cometchatfs-env, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: cometchatfs-env, key: S3_SECRET_KEY } }
            # Set "true" only if media-onprem.cometchat-cluster-2.in serves a self-signed cert during bring-up.
            - name: S3_INSECURE
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
