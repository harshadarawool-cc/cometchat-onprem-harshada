# cometchatFS — the S3 web console (Next.js). Talks to the SeaweedFS S3 gateway.
# Image is the obfuscated, digest-pinned ECR build (needs ecr-pull-secret).
# Env comes from the `cometchatfs-env` secret (created by deploy.sh, not committed):
#   S3_ENDPOINT        = http://seaweedfs-filer.cometchat.svc:8333   (server-side, in-cluster)
#   S3_PUBLIC_ENDPOINT = https://s3-onprem.cometchat-cluster-2.in            (presigned URLs, browser)
#   S3_ACCESS_KEY/S3_SECRET_KEY = match seaweedfs-s3-config identity
#   JWT_SECRET, APP_USERS (scrypt-hashed admin password)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cometchatfs
  namespace: cometchat
  labels: { app: cometchatfs }
spec:
  replicas: 1
  selector:
    matchLabels: { app: cometchatfs }
  template:
    metadata:
      labels: { app: cometchatfs }
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: cometchatfs
          image: 894996064311.dkr.ecr.us-east-2.amazonaws.com/on-prem-docker-images@sha256:122cbf6d95244ad043896f283b9b17fe526b25534580601cb72dafcc79ee495b  # :cometchatfs (latest)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3300
          envFrom:
            - secretRef:
                name: cometchatfs-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /login, port: 3300 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: 3300 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cometchatfs
  namespace: cometchat
  labels: { app: cometchatfs }
spec:
  type: ClusterIP
  selector:
    app: cometchatfs
  ports:
    - name: http
      port: 3300
      targetPort: 3300
      protocol: TCP
