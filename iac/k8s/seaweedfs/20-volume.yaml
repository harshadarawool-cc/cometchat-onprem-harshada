# SeaweedFS volume servers — 3 replicas, one per node. With master -defaultReplication=001
# every object is stored on 2 of these → survives 1 node loss.
# NOTE (sizing): local-path PVs live on the node root disk (~28Gi total, shared with OS/images).
# 20Gi here is NOMINAL (local-path does not enforce it). Production should use dedicated data
# disks — see iac/docs/HA-AND-SIZING-PLAN.md.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-volume
  namespace: cometchat
  labels: { app: seaweedfs, component: volume }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: seaweedfs, component: volume }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: grpc, port: 18080, targetPort: 18080 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs-volume
  namespace: cometchat
  labels: { app: seaweedfs, component: volume }
spec:
  serviceName: seaweedfs-volume
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: seaweedfs, component: volume }
  template:
    metadata:
      labels: { app: seaweedfs, component: volume }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      affinity:
        podAntiAffinity: # one volume server per node so a node loss = at most 1 replica
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: seaweedfs, component: volume }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: volume
          image: chrislusf/seaweedfs:3.80@sha256:1055999e08eed1789b0ae45d235126e4495e23d3fb9d6396293fd42539b1ae6a # PINNED
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          command: ["weed"]
          args:
            - "-logtostderr"
            - "volume"
            - "-mserver=seaweedfs-master-0.seaweedfs-master:9333,seaweedfs-master-1.seaweedfs-master:9333,seaweedfs-master-2.seaweedfs-master:9333"
            - "-ip=$(POD_NAME).seaweedfs-volume"
            - "-ip.bind=0.0.0.0"
            - "-port=8080"
            - "-dir=/data"
            - "-max=100" # volume-count cap (the fix for 'No free volumes'); raise with disk size
            - "-dataCenter=dc1"
            - "-rack=default"
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 18080, name: grpc }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources: { requests: { storage: 20Gi } } # NOMINAL on local-path (see note above)
