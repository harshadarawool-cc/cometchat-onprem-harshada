# =============================================================================
# SeaweedFS S3 edge — per-pod TLS front for the object store (HAProxy edge model).
#
# The filer's S3 gateway speaks PLAIN HTTP on :8333. In the HAProxy SNI-passthrough
# model, media-onprem.<domain> must be reachable over TLS *at a pod* (TLS never
# terminates at the edge). This nginx terminates the wildcard cert on :443 and
# proxies to seaweedfs-filer:8333, preserving the Host header (SigV4 validates the
# signature against the incoming Host, which chatapi signed as media-onprem).
#
# Reached two ways, both landing here:
#   • north-south: HAProxy SNI (media|data|files-onprem) -> nodePort 30449
#     (Service seaweedfs-edge-np in k8s/edge-nodeports.yaml, selects app=seaweedfs-edge)
#   • east-west:   CoreDNS rewrites media/data/files-onprem -> seaweedfs-edge.cometchat.svc
#     (this ClusterIP Service, port 443) so chatapi's server-side PUT stays in-cluster HTTPS.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata: { name: seaweedfs-edge-nginx, namespace: cometchat }
data:
  default.conf: |
    server {
      listen 80;
      listen 443 ssl;
      server_name _;                       # wildcard-tls; HAProxy already SNI-routed here
      ssl_certificate     /etc/nginx/ssl/tls.crt;
      ssl_certificate_key /etc/nginx/ssl/tls.key;
      client_max_body_size 0;              # large object PUTs (no cap)
      proxy_request_buffering off;         # stream uploads straight to the filer
      underscores_in_headers on;
      ignore_invalid_headers off;
      location = /nginx-health { access_log off; return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
      location / {
        proxy_pass http://seaweedfs-filer:8333;
        proxy_set_header Host $host;                       # SigV4 validates on the incoming Host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: seaweedfs-edge, namespace: cometchat, labels: { app: seaweedfs-edge } }
spec:
  replicas: 2                              # active-active behind HAProxy round-robin
  selector: { matchLabels: { app: seaweedfs-edge } }
  template:
    metadata: { labels: { app: seaweedfs-edge } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }, { containerPort: 443, name: https }]
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tls, mountPath: /etc/nginx/ssl, readOnly: true }
          readinessProbe: { httpGet: { path: /nginx-health, port: 80 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 300m, memory: 128Mi } }
      volumes:
        - { name: conf, configMap: { name: seaweedfs-edge-nginx } }
        - { name: tls, secret: { secretName: wildcard-tls } }
---
apiVersion: v1
kind: Service
metadata: { name: seaweedfs-edge, namespace: cometchat, labels: { app: seaweedfs-edge } }
spec:
  # ClusterIP for east-west (CoreDNS media-onprem -> here:443). North-south nodePort
  # is a SEPARATE Service (seaweedfs-edge-np) in k8s/edge-nodeports.yaml.
  selector: { app: seaweedfs-edge }
  ports:
    - { name: http,  port: 80,  targetPort: 80 }
    - { name: https, port: 443, targetPort: 443 }
