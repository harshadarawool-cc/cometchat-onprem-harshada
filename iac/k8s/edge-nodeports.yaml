# =============================================================================
# Edge NodePort overlay — the north-south entry points for the HAProxy edge.
#
# HAProxy (edge VMs) does L4 SNI passthrough and forwards each facing host to a
# FIXED NodePort here. These Services are ADDITIVE overlays: they select the SAME
# pods as the app's primary ClusterIP Service (which east-west/CoreDNS still uses),
# but expose :443 (the pod's nginx TLS sidecar) at a stable nodePort. TLS therefore
# terminates in the pod, never at the edge.
#
# Each nodePort MUST match ansible/group_vars/haproxy.yml:
#   chatapi 30443 · websocket 30444 · dashboard 30445 · mgmtapi 30446 ·
#   analytics 30447 · extensions 30448 · seaweedfs 30449 · document-embed 30450 ·
#   whiteboard 30451 · notificationscore 30452
#
# Internal-only services (metrics-pro, moderationservice, globalwebhooks,
# service-search, visual-chat-builder, ai-agent-service) get NO NodePort — they are
# reached east-west via CoreDNS split-horizon only, and have no public DNS.
# =============================================================================
---
apiVersion: v1
kind: Service
metadata: { name: chatapi-edge, namespace: cometchat, labels: { app.kubernetes.io/part-of: cometchat-edge } }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: chatapi }
  ports: [{ name: https, port: 443, targetPort: 443, nodePort: 30443, protocol: TCP }]
---
apiVersion: v1
kind: Service
metadata: { name: websocket-edge, namespace: cometchat, labels: { app.kubernetes.io/part-of: cometchat-edge } }
spec:
