# Durable RKE2 split-horizon: pods resolve *.cometchat-cluster-2.in -> the INTERNAL ingress
# (rke2-ingress-nginx-internal ClusterIP 10.43.200.10, which terminates the LE wildcard cert and
# routes each host to its Service). Keeps east-west traffic IN-CLUSTER (no hairpin to the edge LB).
# HelmChartConfig survives helm reconciles + reboots (unlike a raw ConfigMap edit).
# servers[0] = the stock rke2-coredns .:53 (reproduced exactly); servers[1] = the cometchat zone.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-coredns
  namespace: kube-system
spec:
  valuesContent: |-
    servers:
      - zones:
          - zone: .
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods insecure
              fallthrough in-addr.arpa ip6.arpa
              ttl 30
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            parameters: 30
          - name: loop
          - name: reload
          - name: loadbalance
      - zones:
          - zone: __DOMAIN__
        port: 53
        plugins:
          - name: errors
          - name: template
            parameters: IN A
            configBlock: |-
              match "^.*__DOMAIN_RE__[.]$"
              answer "{{ .Name }} 60 IN A __INGRESS_IP__"
          - name: template
            parameters: IN AAAA
            configBlock: |-
              match "^.*__DOMAIN_RE__[.]$"
              rcode NOERROR
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            parameters: 30
          - name: reload
