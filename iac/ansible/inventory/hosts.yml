# Static inventory — v3 TEST cluster (cometchat-onprem-v3, 10.23.x, test-scale: 1 of each).
# instance NAMES resolved via IAP tunnel (see group_vars/all/main.yml).
# int_ip = private IP from Terraform. redis_master_ip = the master node of that cluster.
# HA rebuild: add mongo-2/3, redis-*-2/3, kafka-2/3 back here + set redis.count=3.
all:
  children:
    mongo:
      hosts:
        cometchat-onprem-v3-mongo-1: { int_ip: 10.23.10.11, mongo_role: primary }

    # --- 4 DEDICATED Redis Sentinel clusters, 1 node each (TEST scale; each is its own master) ---
    redis_shared:
      hosts:
        cometchat-onprem-v3-redis-shared-1: { int_ip: 10.23.10.21, redis_role: master, redis_master_ip: 10.23.10.21 }
    redis_analytics:
      hosts:
        cometchat-onprem-v3-redis-analytics-1: { int_ip: 10.23.10.24, redis_role: master, redis_master_ip: 10.23.10.24 }
    redis_prometrics:
      hosts:
        cometchat-onprem-v3-redis-prometrics-1: { int_ip: 10.23.10.27, redis_role: master, redis_master_ip: 10.23.10.27 }
    redis_bullmq:
      hosts:
        cometchat-onprem-v3-redis-bullmq-1: { int_ip: 10.23.10.61, redis_role: master, redis_master_ip: 10.23.10.61 }

    kafka:
      hosts:
        cometchat-onprem-v3-kafka-1: { int_ip: 10.23.10.31, kafka_node_id: 1 }
    tidb:
      hosts:
        cometchat-onprem-v3-tidb-1: { int_ip: 10.23.10.51 }
    mysql:
      hosts:
        cometchat-onprem-v3-mysql-1: { int_ip: 10.23.10.41 }

    rke2_servers:
      hosts:
        cometchat-onprem-v3-k8s-master-1: { int_ip: 10.23.20.11 }
    rke2_agents:
      hosts:
        cometchat-onprem-v3-k8s-worker-1: { int_ip: 10.23.20.21 }
        cometchat-onprem-v3-k8s-worker-2: { int_ip: 10.23.20.22 }
        cometchat-onprem-v3-k8s-worker-3: { int_ip: 10.23.20.23 }
    bastion:
      hosts:
        cometchat-onprem-v3-bastion: { int_ip: 10.23.30.10 }

    # --- Edge: 2 HAProxy VMs (L4 SNI passthrough -> per-service NodePorts). ---
    # int_ip = edge-subnet IP (terraform: cidrhost(edge_cidr, 21+i)); each also has a
    # public IP (terraform output haproxy_ips) that DNS round-robins facing hosts across.
    haproxy:
      hosts:
        cometchat-onprem-v3-haproxy-1: { int_ip: 10.23.30.21 }
        cometchat-onprem-v3-haproxy-2: { int_ip: 10.23.30.22 }

    # convenience groups
    redis:
      children: { redis_shared: {}, redis_analytics: {}, redis_prometrics: {}, redis_bullmq: {} }
    datastores:
      children: { mongo: {}, redis: {}, kafka: {}, tidb: {}, mysql: {} }
    rke2:
      children: { rke2_servers: {}, rke2_agents: {} }
