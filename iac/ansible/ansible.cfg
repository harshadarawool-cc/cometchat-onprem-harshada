[defaults]
inventory            = inventory/hosts.yml
remote_user          = ansible
private_key_file     = ssh/cometchat_rke2
host_key_checking    = False
deprecation_warnings = False
retry_files_enabled  = False
interpreter_python   = auto_silent
vault_password_file  = .vault_pass
timeout              = 60

[ssh_connection]
pipelining = True
# VMs have no public IP — reach them through Google IAP TCP forwarding.
# %h = instance name (ansible_host), %p = 22.
ssh_args = -o ControlMaster=auto -o ControlPersist=600s
# retry the SSH connection on transient drops — freshly-booted VMs over an IAP tunnel occasionally go
# UNREACHABLE mid-task ("Data could not be sent to remote host"); retry instead of aborting the host.
retries = 3

