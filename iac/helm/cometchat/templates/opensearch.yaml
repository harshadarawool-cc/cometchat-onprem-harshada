{{/*
opensearch — single-node search backend for service-search / moderation.
New patterns vs mailpit:
  - an initContainer (privileged sysctl) kept inline (not customer config)
  - a PersistentVolumeClaim, with the size pulled from values
  - one env value (heap) made tunable via values; the rest are fixed config
*/}}
{{- $svc := .Values.services.opensearch }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: {{ include "cometchat.namespace" . }}
  labels:
    app: opensearch
    {{- include "cometchat.labels" . | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
        {{- include "cometchat.labels" . | nindent 8 }}
    spec:
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext: { privileged: true }
      containers:
        - name: opensearch
          image: {{ $svc.image }}
          env:
            - { name: discovery.type, value: single-node }
            - { name: DISABLE_SECURITY_PLUGIN, value: "true" }
            - { name: DISABLE_INSTALL_DEMO_CONFIG, value: "true" }
            - { name: OPENSEARCH_JAVA_OPTS, value: {{ $svc.javaOpts | quote }} }
            - { name: bootstrap.memory_lock, value: "false" }
          ports: [{ containerPort: 9200 }, { containerPort: 9300 }]
          volumeMounts: [{ name: data, mountPath: /usr/share/opensearch/data }]
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: opensearch-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensearch-data
  namespace: {{ include "cometchat.namespace" . }}
  labels:
    {{- include "cometchat.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $svc.storage }}
  {{- with $svc.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: {{ include "cometchat.namespace" . }}
  labels:
    app: opensearch
    {{- include "cometchat.labels" . | nindent 4 }}
spec:
  selector:
    app: opensearch
  ports:
    - { name: http, port: 9200, targetPort: 9200 }
    - { name: transport, port: 9300, targetPort: 9300 }
{{- end }}
