{{/*
ollama — local LLM runtime for moderation vision. Same shape as opensearch
minus the initContainer: Deployment + PVC + Service.
*/}}
{{- $svc := .Values.services.ollama }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ include "cometchat.namespace" . }}
  labels:
    app: ollama
    {{- include "cometchat.labels" . | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        {{- include "cometchat.labels" . | nindent 8 }}
    spec:
      containers:
        - name: ollama
          image: {{ $svc.image }}
          ports: [{ containerPort: 11434 }]
          volumeMounts: [{ name: models, mountPath: /root/.ollama }]
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: {{ include "cometchat.namespace" . }}
  labels:
    {{- include "cometchat.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $svc.storage }}
  {{- with $svc.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ include "cometchat.namespace" . }}
  labels:
    app: ollama
    {{- include "cometchat.labels" . | nindent 4 }}
spec:
  selector:
    app: ollama
  ports:
    - { name: http, port: 11434, targetPort: 11434 }
{{- end }}
