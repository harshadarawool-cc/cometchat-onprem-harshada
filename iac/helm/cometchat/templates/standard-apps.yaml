{{/*
Renders every service marked `generic: true` through the cometchat.app helper.
This one small loop replaces ~6 near-identical Deployment+Service files.
Add a new standard service later = a values block, no new template.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.generic }}
{{ include "cometchat.app" (dict "root" $ "name" $name "svc" $svc) }}
---
{{- end }}
{{- end }}
