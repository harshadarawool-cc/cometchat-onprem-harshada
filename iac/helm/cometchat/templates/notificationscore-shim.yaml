{{/*
Companion ConfigMap for the (generic) notificationscore Deployment. The shim
forces a single-CPU path so the app starts ONE process instead of forking a
per-CPU worker storm. Product logic, not customer config — kept verbatim.
*/}}
{{- if .Values.services.notificationscore.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: notificationscore-shim
  namespace: {{ include "cometchat.namespace" . }}
  labels:
    {{- include "cometchat.labels" . | nindent 4 }}
data:
  single-cpu.js: |
    // Report a single CPU so bootstrap() takes the single-process path (startBoth),
    // avoiding the per-CPU worker fork-storm that's overkill for one staging pod.
    const os = require('os');
    const real = os.cpus.bind(os);
    os.cpus = () => {
      const c = real();
      return (c && c.length) ? [c[0]]
        : [{ model: 'shim', speed: 0, times: { user: 0, nice: 0, sys: 0, idle: 0, irq: 0 } }];
    };
{{- end }}
